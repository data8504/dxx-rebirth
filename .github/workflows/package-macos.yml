name: SDL2 compat packaging repair evaluation
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: 14
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install the project's dependencies
        run: brew bundle --verbose
      - name: Discovery regression tests
        run: python3 -m unittest discover -s contrib/homebrew-packaging -p 'test_*.py'
      - name: Build both applications with automatic runtime packaging
        run: scons -j4 opengl=1 sdl2=1 macos_add_frameworks=0 macos_bundle_libs=1 build/D{1,2}X-Rebirth.app
      - name: Compare original, generic, and targeted packaging
        run: python3 contrib/homebrew-packaging/evaluate.py > packaging-comparison.log 2>&1
      - name: Exercise SCons integration and incremental packaging
        run: python3 contrib/homebrew-packaging/incremental.py > packaging-incremental.log 2>&1
      - name: Retain evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: homebrew-packaging-evidence-${{ github.run_id }}
          path: |
            packaging-evidence/*.json
            packaging-evidence/*.txt
            packaging-evidence/*.log
            packaging-evidence/*/*.json
            packaging-*.log
            build/config.log
